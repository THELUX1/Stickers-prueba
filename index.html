<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11100f">
<title>Nébula — Panel de Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #11100f;
    --surface: #191817;
    --surface2: #24211d;
    --text: #f1eadf;
    --muted: #9a9186;
    --line: #35302a;
    --gold: #c9913d;
    --gold2: #e7b96f;
    --green: #5ca99b;
    --red: #d35f5f;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% -15%, #33271955, transparent 38%), var(--bg);
    color: var(--text);
    font-family: "DM Sans", sans-serif;
    padding: 15px;
    min-height: 100vh;
  }
  
  h1, h2, h3 { font-family: "Playfair Display", serif; margin: 0; }
  
  /* Header */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--line);
    margin-bottom: 20px;
  }
  
  .top-bar h1 { font-size: 20px; color: var(--gold2); }
  .top-bar .user-info { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .btn-logout { background: none; border: 1px solid var(--red); color: var(--red); padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
  
  /* Login */
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
  }
  #loginScreen h2 { font-size: 28px; margin-bottom: 10px; }
  #loginScreen p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
  }
  
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  
  input[type="text"], input[type="number"], input[type="email"], input[type="password"], select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    margin-bottom: 12px;
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font: 700 14px "Outfit", sans-serif;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-primary { background: linear-gradient(135deg, #e4b65f, #a96e2b); color: #21170c; }
  .btn-secondary { background: var(--surface2); color: var(--gold2); border: 1px solid var(--line); }
  .btn-danger { background: #d35f5f20; color: var(--red); border: 1px solid #d35f5f44; }
  
  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
  .tab-btn {
    flex: none;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--gold); border-color: var(--gold); color: #21170c; }
  
  /* Dashboard */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 15px; text-align: center; }
  .stat-card h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: var(--gold2); }
  
  /* Obras List */
  .work-item {
    display: flex;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  .work-item img { width: 50px; height: 70px; object-fit: cover; border-radius: 8px; background: var(--bg); }
  .work-info { flex: 1; min-width: 0; }
  .work-info h4 { font-size: 14px; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .work-info p { font-size: 11px; color: var(--muted); margin: 0; }
  .work-actions { display: flex; gap: 5px; flex-direction: column; }
  .btn-sm { padding: 6px 10px; font-size: 10px; border-radius: 8px; }
  
  /* Formularios */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row.full { grid-template-columns: 1fr; }
  
  /* Utilities */
  .hidden { display: none !important; }
  .mt-10 { margin-top: 10px; }
  .mb-10 { margin-bottom: 10px; }
  .text-center { text-align: center; }
  .text-muted { color: var(--muted); }
  
  /* Chapter list */
  .chapter-row {
    background: var(--surface2);
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .chapter-row .ch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chapter-row .ch-actions { display: flex; gap: 8px; }
  .chapter-row button { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0; }
  .chapter-row button:hover { color: var(--gold); }
  .chapter-row .ch-pages-info { font-size: 11px; color: var(--muted); }
  
  /* Upload progress */
  .progress-wrap { margin-top: 10px; background: var(--bg); border-radius: 8px; overflow: hidden; height: 8px; border: 1px solid var(--line); display: none; }
  .progress-wrap.active { display: block; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width 0.2s; }
  
  /* Preview de páginas */
  .pages-preview {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 0;
    margin-top: 10px;
  }
  .pages-preview .page-thumb {
    flex: none;
    width: 60px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #000;
  }
  
  /* Input de archivo oculto */
  .file-input-hidden { display: none; }
</style>
</head>
<body>

<!-- Pantalla de Login -->
<div id="loginScreen">
  <h2>Acceso Administrativo</h2>
  <p>Inicia sesión con tu cuenta de Nébula.</p>
  <div class="card" style="width: 100%; max-width: 400px;">
    <input type="email" id="adminEmail" placeholder="Correo electrónico">
    <input type="password" id="adminPass" placeholder="Contraseña">
    <button class="btn btn-primary" id="loginBtn">Entrar al Panel</button>
    <p id="loginError" class="text-muted mt-10" style="color: var(--red); font-size: 12px; display: none;"></p>
  </div>
</div>

<!-- Panel Principal -->
<div id="adminPanel" class="hidden">
  <div class="top-bar">
    <h1>Panel Nébula</h1>
    <div class="user-info">
      <span id="adminName">Admin</span>
      <button class="btn-logout" id="logoutBtn">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-view="dashboard">📊 Dashboard</button>
    <button class="tab-btn" data-view="works">📚 Obras</button>
    <button class="tab-btn" data-view="new-work">➕ Nueva Obra</button>
  </div>

  <!-- Vista: Dashboard -->
  <div id="view-dashboard">
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Obras</h3>
        <div class="value" id="statTotalWorks">0</div>
      </div>
      <div class="stat-card">
        <h3>Total Capítulos</h3>
        <div class="value" id="statTotalChapters">0</div>
      </div>
    </div>
    <div class="card">
      <h3>Últimas obras agregadas</h3>
      <div id="recentWorksList" class="mt-10">
        <p class="text-muted text-center">Cargando...</p>
      </div>
    </div>
  </div>

  <!-- Vista: Lista de Obras -->
  <div id="view-works" class="hidden">
    <div class="card mb-10">
      <input type="text" id="searchWorks" placeholder="Buscar obra por título...">
    </div>
    <div id="worksList">
      <p class="text-muted text-center">Cargando obras...</p>
    </div>
  </div>

  <!-- Vista: Nueva Obra / Editar Obra -->
  <div id="view-new-work" class="hidden">
    <div class="card">
      <h2 id="formTitle">Nueva Obra</h2>
      <input type="hidden" id="editWorkId" value="">
      
      <label>Título Principal *</label>
      <input type="text" id="workTitle" placeholder="Ej: Solo Leveling">
      
      <div class="form-row">
        <div>
          <label>Tipo *</label>
          <select id="workType">
            <option value="Manga">Manga</option>
            <option value="Manhwa">Manhwa</option>
            <option value="Manhua">Manhua</option>
            <option value="Webtoon">Webtoon</option>
            <option value="Cómic">Cómic</option>
            <option value="Novela">Novela</option>
          </select>
        </div>
        <div>
          <label>Estado *</label>
          <select id="workStatus">
            <option value="En emisión">En emisión</option>
            <option value="Finalizado">Finalizado</option>
            <option value="En pausa">En pausa</option>
            <option value="Cancelado">Cancelado</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>Autor</label>
          <input type="text" id="workAuthor" placeholder="Ej: Chugong">
        </div>
        <div>
          <label>Artista</label>
          <input type="text" id="workArtist" placeholder="Ej: DUBU">
        </div>
      </div>

      <label>Sinopsis</label>
      <textarea id="workSynopsis" placeholder="Descripción de la obra..."></textarea>

      <label>Géneros (separados por coma) *</label>
      <input type="text" id="workGenres" placeholder="Ej: Acción, Fantasía, Aventura">

      <label>Títulos Alternativos (separados por coma)</label>
      <input type="text" id="workAltTitles" placeholder="Ej: Na Honjaman Level Up, I Level Up Alone">

      <div class="form-row">
        <div>
          <label>Año de publicación</label>
          <input type="number" id="workYear" placeholder="Ej: 2018">
        </div>
        <div>
          <label>Demografía</label>
          <select id="workDemographic">
            <option value="">Seleccionar...</option>
            <option value="Shonen">Shonen</option>
            <option value="Seinen">Seinen</option>
            <option value="Shojo">Shojo</option>
            <option value="Josei">Josei</option>
            <option value="Kodomo">Kodomo</option>
            <option value="Adulto">Adulto</option>
          </select>
        </div>
      </div>

      <label>Etiquetas (separadas por coma)</label>
      <input type="text" id="workTags" placeholder="Ej: Reencarnación, Sistema, OP MC">

      <!-- NUEVO: Casilla para destacar obra -->
      <label style="display:flex; align-items:center; gap:10px; background:var(--surface2); padding:12px; border-radius:10px; margin-bottom:15px; cursor:pointer;">
        <input type="checkbox" id="workFeatured" style="width:auto; margin:0; transform:scale(1.3);">
        <span style="font-size:12px; color:var(--gold2); font-weight:600;">⭐ Destacar esta obra en el inicio</span>
      </label>

      <div class="form-row">
        <div>
          <label>URL Portada *</label>
          <input type="text" id="workCover" placeholder="https://...">
          <button class="btn btn-secondary btn-sm mt-10" id="uploadCoverBtn" type="button">📷 Subir Portada</button>
          <div class="progress-wrap" id="coverProgressWrap"><div class="progress-bar" id="coverProgressBar"></div></div>
          <input type="file" id="coverFileInput" accept="image/*" class="file-input-hidden">
        </div>
        <div>
          <label>URL Banner (Opcional)</label>
          <input type="text" id="workBanner" placeholder="https://...">
          <button class="btn btn-secondary btn-sm mt-10" id="uploadBannerBtn" type="button">📷 Subir Banner</button>
          <div class="progress-wrap" id="bannerProgressWrap"><div class="progress-bar" id="bannerProgressBar"></div></div>
          <input type="file" id="bannerFileInput" accept="image/*" class="file-input-hidden">
        </div>
      </div>

      <button class="btn btn-primary mt-10" id="saveWorkBtn">Guardar Obra</button>
      <button class="btn btn-secondary mt-10" id="cancelEditBtn" style="display: none;">Cancelar Edición</button>
    </div>

    <!-- Sección de capítulos -->
    <div class="card hidden" id="chaptersSection">
      <h3>Gestión de Capítulos</h3>
      <p class="text-muted mb-10" style="font-size: 12px;">Administra los capítulos de esta obra.</p>
      
      <div class="form-row">
        <div>
          <label>Número de Capítulo</label>
          <input type="number" id="newChapNum" placeholder="Ej: 1" step="0.1">
        </div>
        <div>
          <label>Título del Capítulo</label>
          <input type="text" id="newChapTitle" placeholder="Ej: El despertar">
        </div>
      </div>
      <button class="btn btn-secondary mb-10" id="addChapterBtn">Añadir Capítulo</button>
      
      <div id="adminChaptersList" class="mt-10">
        <!-- Lista de capítulos -->
      </div>
    </div>
  </div>

</div>

<!-- Input oculto para subir páginas de capítulos -->
<input type="file" id="chapterPagesInput" multiple accept="image/*,.zip,.cbz" class="file-input-hidden">
<input type="file" id="chapterZipInput" accept=".zip,.cbz" class="file-input-hidden">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  // --- CONFIGURACIÓN ---
  const firebaseConfig = {
    apiKey: "AIzaSyBBb2gnOqhAvWnzKBLo-m6bUC_UOYcs2XU",
    authDomain: "stream-hs.firebaseapp.com",
    projectId: "stream-hs",
    storageBucket: "stream-hs.firebasestorage.app",
    messagingSenderId: "875656637210",
    appId: "1:875656637210:web:2f8978871a7be4bcd31aa3"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);
  window.firebaseAuth = auth;

  const ADMIN_UID = "f5u3nXAQbLTVoDtR65MtclCgf0l1"; 

  const $ = (s) => document.querySelector(s);
  let currentWorks = [];
  let currentAdminChapters = [];
  let activeUploadChapterId = null;

  // --- UTILIDADES DE SUBIDA ---
  let uploadUtils = null;
  async function getUploadUtils() {
    if (!uploadUtils) {
      uploadUtils = await import("./upload-utils.js");
    }
    return uploadUtils;
  }

  // --- AUTENTICACIÓN ---
  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.uid !== ADMIN_UID) {
        alert("No tienes permisos de administrador. Serás redirigido.");
        signOut(auth);
        return;
      }
      $("#loginScreen").classList.add("hidden");
      $("#adminPanel").classList.remove("hidden");
      $("#adminName").textContent = user.email.split('@')[0];
      loadDashboard();
    } else {
      $("#loginScreen").classList.remove("hidden");
      $("#adminPanel").classList.add("hidden");
    }
  });

  $("#loginBtn").onclick = async () => {
    const email = $("#adminEmail").value;
    const pass = $("#adminPass").value;
    const err = $("#loginError");
    err.style.display = "none";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      err.textContent = "Error: " + (e.code === 'auth/invalid-credential' ? 'Credenciales incorrectas' : e.message);
      err.style.display = "block";
    }
  };

  $("#logoutBtn").onclick = () => signOut(auth);

  // --- NAVEGACIÓN TABS ---
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      
      const view = btn.dataset.view;
      ["dashboard", "works", "new-work"].forEach(v => {
        $(`#view-${v}`).classList.add("hidden");
      });
      $(`#view-${view}`).classList.remove("hidden");
      
      if (view === "works") loadWorksList();
      if (view === "new-work" && !$("#editWorkId").value) resetWorkForm();
    };
  });

  // --- DASHBOARD ---
  async function loadDashboard() {
    try {
      const worksSnap = await getDocs(collection(db, "works"));
      let totalChaps = 0;
      const works = [];
      
      worksSnap.forEach(doc => {
        const data = doc.data();
        works.push({ id: doc.id, ...data });
        totalChaps += (data.chaptersCount || 0);
      });
      
      $("#statTotalWorks").textContent = works.length;
      $("#statTotalChapters").textContent = totalChaps;
      
      works.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
      const recent = works.slice(0, 3);
      
      if (recent.length === 0) {
        $("#recentWorksList").innerHTML = '<p class="text-muted text-center">No hay obras aún.</p>';
      } else {
        $("#recentWorksList").innerHTML = recent.map(w => `
          <div class="work-item" style="padding: 8px;">
            <img src="${w.cover || 'https://via.placeholder.com/50x70/191817/35302a?text=N'}" alt="">
            <div class="work-info">
              <h4>${w.title || 'Sin título'}</h4>
              <p>${w.type || 'N/A'} · ${w.status || 'N/A'}</p>
            </div>
          </div>
        `).join("");
      }
      
    } catch (error) {
      console.error("Error cargando dashboard:", error);
    }
  }

  // --- LISTA DE OBRAS ---
  async function loadWorksList() {
    const listEl = $("#worksList");
    listEl.innerHTML = '<p class="text-muted text-center">Cargando...</p>';
    try {
      const snap = await getDocs(collection(db, "works"));
      currentWorks = [];
      snap.forEach(doc => currentWorks.push({ id: doc.id, ...doc.data() }));
      currentWorks.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      renderWorksList(currentWorks);
    } catch (error) {
      listEl.innerHTML = `<p class="text-muted text-center" style="color:var(--red)">Error: ${error.message}</p>`;
    }
  }

  function renderWorksList(works) {
    const listEl = $("#worksList");
    if (works.length === 0) {
      listEl.innerHTML = '<p class="text-muted text-center">No se encontraron obras.</p>';
      return;
    }
    
    listEl.innerHTML = works.map(w => `
      <div class="work-item">
        <img src="${w.cover || 'https://via.placeholder.com/50x70/191817/35302a?text=N'}" alt="">
        <div class="work-info">
          <h4>${w.title || 'Sin título'} ${w.featured ? '⭐' : ''}</h4>
          <p>${w.type || 'N/A'} · ${w.status || 'N/A'} · ${w.chaptersCount || 0} caps</p>
        </div>
        <div class="work-actions">
          <button class="btn btn-secondary btn-sm" onclick="editWork('${w.id}')">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="deleteWork('${w.id}')">🗑️</button>
        </div>
      </div>
    `).join("");
  }

  $("#searchWorks").oninput = (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = currentWorks.filter(w => (w.title || "").toLowerCase().includes(term));
    renderWorksList(filtered);
  };

  // --- FORMULARIO DE OBRA ---
  function resetWorkForm() {
    $("#editWorkId").value = "";
    $("#formTitle").textContent = "Nueva Obra";
    $("#workTitle").value = "";
    $("#workType").value = "Manga";
    $("#workStatus").value = "En emisión";
    $("#workAuthor").value = "";
    $("#workArtist").value = "";
    $("#workSynopsis").value = "";
    $("#workGenres").value = "";
    $("#workAltTitles").value = "";
    $("#workYear").value = "";
    $("#workDemographic").value = "";
    $("#workTags").value = "";
    $("#workFeatured").checked = false; // <-- Nuevo
    $("#workCover").value = "";
    $("#workBanner").value = "";
    $("#cancelEditBtn").style.display = "none";
    $("#chaptersSection").classList.add("hidden");
    $("#coverProgressWrap").classList.remove("active");
    $("#bannerProgressWrap").classList.remove("active");
  }

  window.editWork = async (id) => {
    try {
      const snap = await getDoc(doc(db, "works", id));
      if (!snap.exists()) return alert("Obra no encontrada");
      const w = snap.data();
      
      $("#editWorkId").value = id;
      $("#formTitle").textContent = "Editar Obra";
      $("#workTitle").value = w.title || "";
      $("#workType").value = w.type || "Manga";
      $("#workStatus").value = w.status || "En emisión";
      $("#workAuthor").value = w.author || "";
      $("#workArtist").value = w.artist || "";
      $("#workSynopsis").value = w.synopsis || "";
      $("#workGenres").value = (w.genres || []).join(", ");
      $("#workAltTitles").value = (w.altTitles || []).join(", ");
      $("#workYear").value = w.year || "";
      $("#workDemographic").value = w.demographic || "";
      $("#workTags").value = (w.tags || []).join(", ");
      $("#workFeatured").checked = w.featured || false; // <-- Nuevo
      $("#workCover").value = w.cover || "";
      $("#workBanner").value = w.banner || "";
      
      $("#cancelEditBtn").style.display = "block";
      $("#chaptersSection").classList.remove("hidden");
      
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelector('[data-view="new-work"]').classList.add("active");
      ["dashboard", "works", "new-work"].forEach(v => {
        $(`#view-${v}`).classList.add("hidden");
      });
      $("#view-new-work").classList.remove("hidden");
      
      loadAdminChapters(id);
      
    } catch (error) {
      console.error(error);
      alert("Error cargando la obra: " + error.message);
    }
  };

  $("#cancelEditBtn").onclick = () => {
    resetWorkForm();
    document.querySelector('[data-view="works"]').click();
  };

  $("#saveWorkBtn").onclick = async () => {
    const id = $("#editWorkId").value;
    const title = $("#workTitle").value.trim();
    if (!title) return alert("El título es obligatorio.");
    
    const genres = $("#workGenres").value.split(",").map(g => g.trim()).filter(g => g);
    const altTitles = $("#workAltTitles").value.split(",").map(a => a.trim()).filter(a => a);
    const tags = $("#workTags").value.split(",").map(t => t.trim()).filter(t => t);
    
    const workData = {
      title,
      type: $("#workType").value,
      status: $("#workStatus").value,
      author: $("#workAuthor").value.trim(),
      artist: $("#workArtist").value.trim(),
      synopsis: $("#workSynopsis").value.trim(),
      genres,
      altTitles,
      year: Number($("#workYear").value) || null,
      demographic: $("#workDemographic").value,
      tags,
      featured: $("#workFeatured").checked, // <-- Nuevo
      cover: $("#workCover").value.trim(),
      banner: $("#workBanner").value.trim(),
      updatedAt: serverTimestamp()
    };
    
    const btn = $("#saveWorkBtn");
    btn.disabled = true;
    btn.textContent = "Guardando...";
    
    try {
      if (id) {
        await updateDoc(doc(db, "works", id), workData);
        alert("Obra actualizada correctamente.");
      } else {
        workData.createdAt = serverTimestamp();
        workData.chaptersCount = 0;
        await addDoc(collection(db, "works"), workData);
        alert("Obra creada correctamente.");
        resetWorkForm();
      }
      loadDashboard();
    } catch (error) {
      console.error(error);
      alert("Error guardando: " + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Guardar Obra";
    }
  };

  window.deleteWork = async (id) => {
    if (!confirm("¿Estás seguro de eliminar esta obra? Se perderán sus capítulos asociados.")) return;
    try {
      await deleteDoc(doc(db, "works", id));
      alert("Obra eliminada.");
      loadWorksList();
      loadDashboard();
    } catch (error) {
      alert("Error eliminando: " + error.message);
    }
  };

  // --- SUBIDA DE PORTADA Y BANNER ---
  $("#uploadCoverBtn").onclick = () => $("#coverFileInput").click();
  $("#uploadBannerBtn").onclick = () => $("#bannerFileInput").click();

  $("#coverFileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const workId = $("#editWorkId").value;
    if (!workId) {
      alert("Primero debes guardar la obra para generar un ID, y luego podrás subir la portada.");
      return;
    }

    try {
      const utils = await getUploadUtils();
      const ext = utils.EXT_MAP[file.type] || "jpg";
      const path = utils.getCoverPath(workId, ext);
      
      $("#coverProgressWrap").classList.add("active");
      $("#coverProgressBar").style.width = "0%";
      $("#uploadCoverBtn").disabled = true;
      
      const url = await utils.uploadToR2(file, path, (p) => {
        $("#coverProgressBar").style.width = p + "%";
      });
      
      $("#workCover").value = url;
      alert("Portada subida correctamente.");
    } catch (error) {
      alert("Error subiendo portada: " + error.message);
    } finally {
      $("#uploadCoverBtn").disabled = false;
      setTimeout(() => {
        $("#coverProgressWrap").classList.remove("active");
        $("#coverProgressBar").style.width = "0%";
      }, 1000);
      e.target.value = "";
    }
  };

  $("#bannerFileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const workId = $("#editWorkId").value;
    if (!workId) {
      alert("Primero debes guardar la obra para generar un ID, y luego podrás subir el banner.");
      return;
    }

    try {
      const utils = await getUploadUtils();
      const ext = utils.EXT_MAP[file.type] || "jpg";
      const path = utils.getBannerPath(workId, ext);
      
      $("#bannerProgressWrap").classList.add("active");
      $("#bannerProgressBar").style.width = "0%";
      $("#uploadBannerBtn").disabled = true;
      
      const url = await utils.uploadToR2(file, path, (p) => {
        $("#bannerProgressBar").style.width = p + "%";
      });
      
      $("#workBanner").value = url;
      alert("Banner subido correctamente.");
    } catch (error) {
      alert("Error subiendo banner: " + error.message);
    } finally {
      $("#uploadBannerBtn").disabled = false;
      setTimeout(() => {
        $("#bannerProgressWrap").classList.remove("active");
        $("#bannerProgressBar").style.width = "0%";
      }, 1000);
      e.target.value = "";
    }
  };

  // --- GESTIÓN DE CAPÍTULOS ---
  async function loadAdminChapters(workId) {
    const listEl = $("#adminChaptersList");
    listEl.innerHTML = '<p class="text-muted text-center" style="font-size:12px;">Cargando capítulos...</p>';
    
    try {
      const q = query(collection(db, "works", workId, "chapters"), orderBy("number", "desc"));
      const snap = await getDocs(q);
      
      currentAdminChapters = [];
      snap.forEach(doc => currentAdminChapters.push({ id: doc.id, ...doc.data() }));
      
      if (currentAdminChapters.length === 0) {
        listEl.innerHTML = '<p class="text-muted text-center" style="font-size:12px;">No hay capítulos aún.</p>';
      } else {
        listEl.innerHTML = currentAdminChapters.map(ch => `
          <div class="chapter-row">
            <div class="ch-header">
              <div>
                <strong>Cap. ${ch.number}</strong> ${ch.title ? `- ${ch.title}` : ''}
              </div>
              <div class="ch-actions">
                <button onclick="uploadPagesToChapter('${workId}', '${ch.id}')" title="Subir páginas">📤</button>
                <button onclick="deleteChapter('${workId}', '${ch.id}')" title="Eliminar" style="color:var(--red)">✕</button>
              </div>
            </div>
            <div class="ch-pages-info">${ch.pages?.length || 0} páginas</div>
            <div class="progress-wrap" id="ch-progress-${ch.id}"><div class="progress-bar" id="ch-bar-${ch.id}"></div></div>
          </div>
        `).join("");
      }
    } catch (error) {
      console.error(error);
      listEl.innerHTML = `<p class="text-muted text-center" style="color:var(--red); font-size:12px;">Error: ${error.message}</p>`;
    }
  }

  $("#addChapterBtn").onclick = async () => {
    const workId = $("#editWorkId").value;
    if (!workId) return alert("Primero debes guardar la obra.");
    
    const num = parseFloat($("#newChapNum").value);
    const title = $("#newChapTitle").value.trim();
    
    if (isNaN(num) || num <= 0) return alert("Introduce un número válido.");
    
    const exists = currentAdminChapters.some(ch => Number(ch.number) === num);
    if (exists) return alert("Ya existe un capítulo con ese número.");
    
    const btn = $("#addChapterBtn");
    btn.disabled = true;
    btn.textContent = "Añadiendo...";
    
    try {
      await addDoc(collection(db, "works", workId, "chapters"), {
        number: num,
        title: title,
        pages: [],
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      
      const workRef = doc(db, "works", workId);
      const workSnap = await getDoc(workRef);
      if (workSnap.exists()) {
        const currentCount = workSnap.data().chaptersCount || 0;
        await updateDoc(workRef, { chaptersCount: currentCount + 1 });
      }
      
      $("#newChapNum").value = "";
      $("#newChapTitle").value = "";
      loadAdminChapters(workId);
      alert("Capítulo añadido.");
    } catch (error) {
      alert("Error: " + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Añadir Capítulo";
    }
  };

  window.deleteChapter = async (workId, chapterId) => {
    if (!confirm("¿Eliminar este capítulo?")) return;
    try {
      await deleteDoc(doc(db, "works", workId, "chapters", chapterId));
      const workRef = doc(db, "works", workId);
      const workSnap = await getDoc(workRef);
      if (workSnap.exists()) {
        const currentCount = workSnap.data().chaptersCount || 1;
        await updateDoc(workRef, { chaptersCount: Math.max(0, currentCount - 1) });
      }
      loadAdminChapters(workId);
    } catch (error) {
      alert("Error: " + error.message);
    }
  };

  // --- SUBIDA DE PÁGINAS A UN CAPÍTULO ---
  window.uploadPagesToChapter = (workId, chapterId) => {
    activeUploadChapterId = chapterId;
    $("#chapterZipInput").click();
  };

  $("#chapterZipInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const workId = $("#editWorkId").value;
    const chapterId = activeUploadChapterId;
    if (!workId || !chapterId) return alert("Error: falta ID de obra o capítulo.");
    
    const progressWrap = $(`#ch-progress-${chapterId}`);
    const progressBar = $(`#ch-bar-${chapterId}`);
    
    try {
      progressWrap.classList.add("active");
      progressBar.style.width = "0%";
      
      // 1. Extraer imágenes del ZIP/CBZ
      let imageFiles = [];
      
      if (file.name.toLowerCase().endsWith(".zip") || file.name.toLowerCase().endsWith(".cbz")) {
        alert("Extrayendo archivo ZIP/CBZ... Esto puede tardar unos segundos.");
        
        const zip = await JSZip.loadAsync(file);
        const entries = [];
        
        zip.forEach((relativePath, zipEntry) => {
          if (zipEntry.dir) return;
          const name = zipEntry.name.toLowerCase();
          if (name.startsWith('__') || name.includes('/.')) return;
          if (/\.(jpg|jpeg|png|webp|avif|gif)$/i.test(name)) {
            entries.push(zipEntry);
          }
        });
        
        entries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
        
        for (const entry of entries) {
          const blob = await entry.async("blob");
          const ext = entry.name.split('.').pop().toLowerCase();
          const mimeType = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' :
                           ext === 'png' ? 'image/png' :
                           ext === 'webp' ? 'image/webp' :
                           ext === 'avif' ? 'image/avif' : 'image/gif';
          const f = new File([blob], entry.name, { type: mimeType });
          imageFiles.push(f);
        }
      } else {
        imageFiles = [file];
      }
      
      if (imageFiles.length === 0) {
        throw new Error("No se encontraron imágenes válidas en el archivo.");
      }
      
      alert(`Se encontraron ${imageFiles.length} páginas. Comenzando subida...`);
      
      // 2. Subir cada imagen a R2
      const utils = await getUploadUtils();
      const uploadedUrls = [];
      let failedCount = 0;
      
      for (let i = 0; i < imageFiles.length; i++) {
        const imgFile = imageFiles[i];
        const pageNum = i + 1;
        const ext = utils.EXT_MAP[imgFile.type] || 'jpg';
        const path = utils.getPagePath(workId, chapterId, pageNum, ext);
        
        try {
          const url = await utils.uploadToR2(imgFile, path, (p) => {
            const overall = Math.round(((i + p / 100) / imageFiles.length) * 100);
            progressBar.style.width = overall + "%";
          });
          uploadedUrls.push(url);
        } catch (err) {
          console.error(`Error subiendo página ${pageNum}:`, err);
          failedCount++;
        }
      }
      
      // 3. Guardar URLs en Firestore
      if (uploadedUrls.length > 0) {
        await updateDoc(doc(db, "works", workId, "chapters", chapterId), {
          pages: uploadedUrls,
          updatedAt: serverTimestamp()
        });
      }
      
      progressBar.style.width = "100%";
      
      if (failedCount > 0) {
        alert(`Subida completada con errores.\n${uploadedUrls.length} páginas subidas.\n${failedCount} fallaron.`);
      } else {
        alert(`¡Capítulo completo! ${uploadedUrls.length} páginas subidas correctamente.`);
      }
      
      loadAdminChapters(workId);
      
    } catch (error) {
      console.error(error);
      alert("Error en la subida: " + error.message);
    } finally {
      setTimeout(() => {
        if (progressWrap) progressWrap.classList.remove("active");
        if (progressBar) progressBar.style.width = "0%";
      }, 1500);
      e.target.value = "";
    }
  };

  // Inicializar
  resetWorkForm();

</script>
</body>
</html>
